# pnpm settings (pnpm 11 reads them from this file, not from .npmrc).

# Dependency install scripts are blocked by default; list each one explicitly.
allowBuilds:
  # Prebuilt binaries come from @parcel/watcher-<platform>; building from source is not needed.
  '@parcel/watcher': false
  # postinstall only switches between Vue 2 / Vue 3 builds; the default build already targets Vue 3.
  vue-demi: false
