<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="%VITE_APP_TITLE% — стартовый шаблон Vue 3 + Vite + TypeScript + FSD" />
    <title>%VITE_APP_TITLE%</title>
    <script>
      // Apply the dark theme before first paint to avoid a light flash.
      // Keep in sync with src/features/toggle-theme/config/theme.ts (storage key, class name).
      try {
        var mode = localStorage.getItem('app:theme')
        var dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('app-dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
